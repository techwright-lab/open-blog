name: Publish

on:
  workflow_run:
    workflows: [CI, Installer, Docs]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: open-blog-release
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.repository == 'techwright-lab/open-blog' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - name: Check for an unreleased version with passing checks
        id: release
        run: ruby bin/release-check verify

  publish:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - name: Verify release eligibility
        id: release
        run: ruby bin/release-check verify
      - name: Build and compare the release artifact
        id: artifact
        if: steps.release.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
        run: ruby bin/release-check artifact
      - name: Configure RubyGems trusted publishing
        if: steps.artifact.outputs.should_publish == 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish to RubyGems
        if: steps.artifact.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: gem push "open_blog-${RELEASE_VERSION}.gem" --host https://rubygems.org
      - name: Tag and publish the GitHub release notes
        if: steps.release.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ruby bin/release-check finish
