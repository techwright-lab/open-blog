name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec ruby test/comment_policy_test.rb
      - name: Measure comment density
        run: |
          git ls-files -z -- '*.rb' '*.gemspec' Gemfile Rakefile |
            xargs -0 -r awk '
              /[^[:space:]]/ { lines++ }
              /^[[:space:]]*#/ { comments++ }
              END {
                printf "Full-line comments: %d / %d nonblank lines (%.2f%%)\n", comments, lines, lines ? 100 * comments / lines : 0
              }
            '

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        rails: ["~> 8.0.0", "~> 8.1.0"]
        database: [postgres, sqlite]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      DB: ${{ matrix.database }}
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ${{ matrix.rails }}
      - name: Prepare host database
        working-directory: test/dummy
        run: bundle exec rails db:prepare
      - name: Verify content migrations roll back
        working-directory: test/dummy
        run: |
          bundle exec rails db:rollback STEP=13
          bundle exec rails db:migrate
      - name: Run gem tests through the host
        run: bundle exec ruby bin/test

  test:
    if: always()
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix cell to pass
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$MATRIX_RESULT" = success
